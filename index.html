<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>3D Character Standing Viewer</title>
  <!-- Google model-viewer 라이브러리 로드 연산 -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #121212; /* 모바일 시각성 확보용 어두운 배경 연산 */
    }
    model-viewer {
      width: 100vw;
      height: 100vh;
      --poster-color: transparent;
    }
  </style>
</head>
<body>

  <!-- 
    [속성 설정 분석]
    - src: 저장한 .glb 파일 경로 지정
    - camera-controls: 터치 및 마우스 회전/조작 가동
    - touch-action="pan-y": 모바일 스크롤 및 조작 충돌 방지
    - auto-rotate: 캐릭터 자동 회전 연산 가동
    - shadow-intensity: 바닥 그림자 명암도 설정
  -->
  <model-viewer 
    src="model-mrc-ab.glb" 
    alt="3D 캐릭터 스탠딩 모델" 
    camera-controls 
    touch-action="pan-y" 
    auto-rotate 
    shadow-intensity="1" 
    exposure="1"
    interaction-prompt="none">
  </model-viewer>

</body>
</html>
